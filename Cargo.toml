[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/model",
    "crates/market",
    "crates/scanner",
    "crates/pine",
    "crates/cdp",
]
resolver = "3"

[workspace.package]
authors = ["HumInvLitterae"]
version = "0.31.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
base64-simd = "0.8.0"
clap = "4.6.5"
futures-util = "0.3.33"
image = { version = "0.25.10", default-features = false }
predicates = "3.1.4"
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

tradingview-cdp = { path = "crates/cdp" }
tradingview-cli = { path = "crates/cli" }
tradingview-core = { path = "crates/core" }
tradingview-market = { path = "crates/market" }
tradingview-model = { path = "crates/model" }
tradingview-pine = { path = "crates/pine" }
tradingview-scanner = { path = "crates/scanner" }
