[package]
name = "tradingview-cli"
authors = ["HumInvLitterae"]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = [".", "crates/core", "crates/market"]
resolver = "3"

[[bin]]
name = "tv"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3.32", features = ["sink"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = "0.29.0"
tradingview-core = { path = "crates/core" }
tradingview-market = { path = "crates/market" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
