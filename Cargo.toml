[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/model",
    "crates/market",
    "crates/scanner",
    "crates/pine",
    "crates/cdp",
]
resolver = "3"

[workspace.package]
authors = ["HumInvLitterae"]
version = "0.12.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.1"
base64 = "0.22.1"
clap = "4.6.1"
futures-util = "0.3.32"
image = { version = "0.25.10", default-features = false }
predicates = "3.1.4"
reqwest = "0.13.3"
serde = "1.0.228"
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.2"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

tradingview-cdp = { path = "crates/cdp" }
tradingview-cli = { path = "crates/cli" }
tradingview-core = { path = "crates/core" }
tradingview-market = { path = "crates/market" }
tradingview-model = { path = "crates/model" }
tradingview-pine = { path = "crates/pine" }
tradingview-scanner = { path = "crates/scanner" }
