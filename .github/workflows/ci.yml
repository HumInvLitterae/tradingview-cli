name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep equal to the node pin in mise.toml; the JavaScript gates check it.
  NODE_VERSION: "26.13.0"

jobs:
  script-check:
    name: Script checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check public hygiene
        run: |
          python scripts/check-public-hygiene.py --self-test
          python scripts/check-public-hygiene.py
      - name: Check runtime package reference validator
        run: python scripts/check-runtime-package.py --self-test
      - name: Check required test selection
        run: python scripts/test_required_tests.py
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check JavaScript contract gate
        run: node --test scripts/check-js-contracts.test.mjs
      - name: Stage runtime guidance fixture
        shell: bash
        run: |
          mkdir -p target
          touch target/package-fixture-binary
          bash scripts/stage-release-package-files.sh target/package-guidance-check target/package-fixture-binary
      - name: Check shell scripts
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/git-hooks/pre-commit-fast.sh
          bash -n scripts/git-hooks/pre-push-baseline.sh
          bash -n scripts/install-config-hooks.sh
          bash -n scripts/stage-release-package-files.sh
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/git-hooks/pre-commit-fast.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw $errors[0] }
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/git-hooks/pre-push-baseline.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw $errors[0] }
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install-config-hooks.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw $errors[0] }

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  study-values-js-contract:
    name: Study-value, equity, account and Desktop JavaScript contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run study-value, equity, account and Desktop JavaScript contracts
        run: |
          node scripts/check-js-contracts.mjs study-values equity account desktop
      - name: Install schema test runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check output schemas against production fixtures
        run: |
          python -m pip install jsonschema==4.26.0
          python scripts/check-output-schemas.py

  pine-open-js-contract:
    name: Pine open JavaScript contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Pine open JavaScript contract
        run: node scripts/check-js-contracts.mjs pine-open

  indicator-insertion-js-contract:
    name: Indicator insertion JavaScript contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run indicator insertion JavaScript contract
        run: node scripts/check-js-contracts.mjs indicator-insertion

  three-point-drawing-js-contract:
    name: Three-point drawing JavaScript contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run three-point drawing JavaScript contract
        run: node scripts/check-js-contracts.mjs three-point-drawing

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace

      - name: Install isolated Linux credential test services
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Check Linux Secret Service integration
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-secret-service.sh
