[package]
name = "tradingview-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmcp.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util.workspace = true
http.workspace = true
sse-stream.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process", "net", "rt", "macros", "time", "sync"] }
tradingview-core.workspace = true
tradingview-model.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
