[package]
name = "tradingview-cdp"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.32", features = ["sink"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["time", "net"] }
tokio-tungstenite = "0.29.0"
tradingview-core = { path = "../core" }
