[package]
name = "tradingview-cli"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tv"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
image = { workspace = true, features = ["png"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tradingview-cdp = { workspace = true }
tradingview-core = { workspace = true }
tradingview-market = { workspace = true }
tradingview-model = { workspace = true }
tradingview-pine = { workspace = true }
tradingview-scanner = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
