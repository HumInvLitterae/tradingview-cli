[tools]
node = "24.18.0"

[tasks."check:fast"]
description = "Run fast local checks used by the pre-commit hook"
run = "bash scripts/git-hooks/pre-commit-fast.sh"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/git-hooks/pre-commit-fast.ps1"

[tasks."check:baseline"]
description = "Run the full local baseline used by the pre-push hook"
run = "bash scripts/git-hooks/pre-push-baseline.sh"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/git-hooks/pre-push-baseline.ps1"

[tasks."check:study-values-js"]
description = "Run the study-value JavaScript contract with pinned Node.js"
run = "python3 scripts/check-study-values-js-contract.py"
run_windows = "python scripts/check-study-values-js-contract.py"

[tasks."check:pine-open-js"]
description = "Run the Pine open JavaScript contract with pinned Node.js"
run = "python3 scripts/check-pine-open-js-contract.py"
run_windows = "python scripts/check-pine-open-js-contract.py"

[tasks."check:indicator-insertion-js"]
description = "Run the indicator insertion JavaScript contract with pinned Node.js"
run = "python3 scripts/check-indicator-insertion-js-contract.py"
run_windows = "python scripts/check-indicator-insertion-js-contract.py"

[tasks."check:three-point-drawing-js"]
description = "Run the three-point drawing JavaScript contract with pinned Node.js"
run = "python3 scripts/check-three-point-drawing-js-contract.py"
run_windows = "python scripts/check-three-point-drawing-js-contract.py"

[tasks."hooks:install"]
description = "Install Git 2.54 config-based hooks into local git config"
run = '''
bash scripts/install-config-hooks.sh
'''
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-config-hooks.ps1"

[tasks."hooks:list"]
description = "List configured local Git hooks for this repository"
run = '''
git hook list pre-commit || true
git hook list pre-push || true
'''

[tasks."hooks:disable"]
description = "Disable repo-local config-based hooks"
run = '''
git config --local hook.tv-fast.enabled false
git config --local hook.tv-baseline.enabled false
git hook list pre-commit || true
git hook list pre-push || true
'''

[tasks."hooks:enable"]
description = "Enable repo-local config-based hooks"
run = '''
git config --local hook.tv-fast.enabled true
git config --local hook.tv-baseline.enabled true
git hook list pre-commit || true
git hook list pre-push || true
'''
